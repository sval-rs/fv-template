[package]
name = "fv-template"
version = "0.7.0"
authors = ["Ashley Mannix <hey@kodraus.com>"]
edition = "2024"
license = "MIT"
documentation = "https://docs.rs/fv-template"
description = "Field-value based string templating"
repository = "https://github.com/sval-rs/fv-template"
readme = "README.md"
exclude = [
    ".github/*",
]

[dependencies.proc-macro2]
version = "1"

[dependencies.quote]
version = "1"

[dependencies.syn]
version = "3"
features = ["full", "visit-mut"]
